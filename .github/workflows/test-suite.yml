---
name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"
    env:
      USING_COVERAGE: "3.13"

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "pypy3.9"]

    steps:
      - uses: actions/checkout@v4
      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Install dependencies"
        run: |
          set -xe
          python -VV
          python -m site
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade coverage[toml] virtualenv tox tox-gh-actions
          cd tests/acceptance_tests/javascript/ && npm install

      - name: "Run tox targets for ${{ matrix.python-version }}"
        run: "python -m tox"

      - name: "Convert coverage"
        if: "contains(env.USING_COVERAGE, matrix.python-version)"
        run: "python -m coverage xml"

      - name: "Upload coverage to Codecov"
        if: "contains(env.USING_COVERAGE, matrix.python-version)"
        uses: "codecov/codecov-action@v4.5.0"
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  sql-backends:
    name: "PostgreSQL 16 and MySQL 8"
    runs-on: "ubuntu-latest"
    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_USER: lunr
          POSTGRES_PASSWORD: lunr
          POSTGRES_DB: lunr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lunr -d lunr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: lunr
          MYSQL_USER: lunr
          MYSQL_PASSWORD: lunr
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ulunr -plunr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LUNR_TEST_POSTGRESQL_URL: postgresql://lunr:lunr@127.0.0.1:5432/lunr
      LUNR_TEST_MYSQL_URL: mysql://lunr:lunr@127.0.0.1:3306/lunr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Install SQL test dependencies"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,sql]"
      - name: "Run live SQL backend contracts"
        run: >-
          pytest -q
          tests/storage/test_sql_postgresql.py
          tests/storage/test_sql_mysql.py
